<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Monkeys Store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .maker-container {
            padding: 40px;
            display: flex;
            justify-content: center;
        }
        .maker-form {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .maker-form h2 {
            margin-top: 0;
            color: var(--price-green);
            text-transform: uppercase;
            font-size: 1.2rem;
        }
        .maker-form input {
            padding: 12px;
            background: #111;
            border: 1px solid #333;
            color: white;
            border-radius: 4px;
            font-size: 1rem;
        }
        .maker-form button {
            background: var(--btn-red);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        .maker-form button:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo-container">
            <img src="img/LogoMonkeysHome.png" alt="Monkeys Store" class="logo">
            <h1 class="brand-name">MONKEYS <br><span>MAKER</span></h1>
        </div>
        <div class="header-icons">
            <i class="fas fa-sign-out-alt user-icon" style="cursor: pointer;" onclick="window.location.href='index.html'"></i>
        </div>
    </header>

    <main class="maker-container">
        <form id="form-maker" class="maker-form">
            <h2>Adicionar Novo Produto</h2>
            <input type="text" id="nome" placeholder="Nome da Peça (ex: Camisa Oversized Puma)" required>
            <input type="text" id="marca" placeholder="Marca (ex: Puma)" required>
            <input type="text" id="tipo" placeholder="Categoria (ex: OVERSIZED)" required>
            <input type="number" id="preco" placeholder="Preço (ex: 89.90)" step="0.01" required>
            
            <input type="file" id="imagemFile" accept="image/*" required style="background: #111; color: white; padding: 10px;">
            
            <button type="submit">Publicar no Catálogo</button>
        </form>
    </main>

    <script src="maker.js"></script>
</body>
</html>
