<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Conta - Monkeys Store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .perfil-container { max-width: 600px; margin: 50px auto; background: #0a0a0a; padding: 40px; border-radius: 8px; border: 1px solid #222; color: white; text-align: center; }
        .perfil-container h2 { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; margin-bottom: 20px; color: var(--brand-red, #e60000); letter-spacing: 2px; }
        .info-box { background: #111; padding: 20px; border-radius: 6px; border: 1px solid #333; margin-bottom: 20px; text-align: left; }
        .info-box p { margin: 10px 0; font-size: 1.1rem; color: #aaa; }
        .info-box strong { color: white; }
        .btn-logout { background: #222; color: white; border: 1px solid #444; padding: 15px 30px; font-size: 1rem; font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.3s; width: 100%; text-transform: uppercase; }
        .btn-logout:hover { background: var(--brand-red, #e60000); border-color: var(--brand-red, #e60000); }
    </style>
</head>
<body style="background-color: #000; margin: 0;">

    <header class="header" style="display: flex; justify-content: center; padding: 20px; border-bottom: 1px solid #222;">
        <a href="index.html">
            <img src="img/LogoMonkeysHome - Editado.png" alt="Monkeys Store" style="height: 180px;">
        </a>
    </header>

    <main class="perfil-container">
        <h2>Minha Conta</h2>
        
        <div class="info-box">
            <p><strong>Nome:</strong> <span id="perfil-nome">A carregar...</span></p>
            <p><strong>E-mail:</strong> <span id="perfil-email">A carregar...</span></p>
        </div>

        <button class="btn-logout" onclick="fazerLogout()">Sair da Conta</button>
    </main>

    <script src="perfil.js"></script>
</body>
</html>
