<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkeys Store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>

    <!-- Cabeçalho -->
    <header class="header">
        <div class="logo-container">
            <img src="img/LogoMonkeysHome - Editado.png" alt="Monkeys Store" class="logo">
        </div>
        <div class="header-icons">
            <i class="fas fa-shopping-cart cart-icon" onclick="abrirSidebar()" style="cursor: pointer;"></i>
            <i class="fas fa-user user-icon"></i>
        </div>
    </header>

    <!-- Layout Principal -->
    <div class="main-container">
        
        <!-- Menu Lateral -->
        <aside class="sidebar-categorias">
            <h3 class="titulo-sidebar">Categorias</h3>
            <ul class="menu-categorias" id="lista-categorias">
                <li><a href="#" class="link-categoria">A carregar categorias...</a></li>
            </ul>
        </aside>

        <!-- Vitrine de Produtos -->
        <main class="content">
            <div class="product-grid">
                <!-- Conteúdo injetado via app.js -->
            </div>
        </main>
    </div>

    <!-- Sidebar do Carrinho -->
    <div id="carrinho-sidebar" class="carrinho-sidebar">
        <div class="carrinho-header">
            <h2>MEU CARRINHO</h2>
            <button class="fechar-btn" onclick="fecharCarrinhos()">X</button>
        </div>
        <div id="itens-sidebar" class="carrinho-lista"></div>
        <div class="carrinho-footer">
            <h3>TOTAL: <span id="total-sidebar" style="color: var(--price-green);">R$ 0,00</span></h3>
            <button class="btn-cart" onclick="finalizarPedido()" style="width: 100%; margin-top: 10px;">FINALIZAR ENCOMENDA</button>
        </div>
    </div>
    
    <div id="carrinho-overlay" class="carrinho-overlay" onclick="fecharCarrinhos()"></div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="app.js"></script>
</body>
</html>
