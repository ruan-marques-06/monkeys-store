<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkeys Store</title>
    <link rel="stylesheet" href="style.css">
    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- Cabeçalho -->
    <header class="header">
        <div class="logo-container">
            <img src="img/LogoMonkeysHome - Editado.png" alt="Monkeys Store" class="logo">
            <!--<h1 class="brand-name">MONKEYS <br><span>STORE</span></h1>-->
        </div>
        <div class="header-icons">
            <i class="fas fa-shopping-cart cart-icon"></i>
            <i class="fas fa-user user-icon"></i>
        </div>
    </header>

    <!-- Layout Principal -->
    <div class="main-container">
        
        <!-- Menu Lateral -->
        <aside class="sidebar">
            <ul class="category-list">
                <li class="active">OVERSIZED</li>
                <li>CARGO</li>
                <li>SHORT SARJA</li>
                <li>SHORT CARGO</li>
            </ul>
        </aside>

        <!-- Vitrine de Produtos -->
        <main class="content">
            <div class="product-grid">
                <!-- O app.js vai injetar os cartões aqui dentro -->
            </div>
        </main>
    </div>

    <!-- Script de automação -->
    <script src="app.js"></script>
</body>
</html>
