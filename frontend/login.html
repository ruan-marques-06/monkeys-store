<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Monkeys Store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Coloque isto junto aos outros links de CSS no <head> -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <style>
        /* Estilos específicos para centralizar o layout da imagem na tela */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #000; /* Mantém o fundo escuro do site */
        }
        
        .login-card {
            background: var(--bg-card, #111);
            border: 1px solid var(--border-color, #333);
            border-radius: 30px; /* Bordas bem arredondadas como na imagem */
            padding: 50px 40px;
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
        }

        .login-icon {
            font-size: 5rem;
            color: var(--price-green, #00ff00); /* Ícone com a cor de destaque da loja */
            margin-bottom: 30px;
        }

        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .login-form input {
            padding: 15px;
            background: #222; /* Fundo do input escuro para combinar com o tema */
            border: 1px solid #444;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        .login-form input:focus {
            outline: none;
            border-color: var(--price-green, #00ff00);
        }

        .login-form button {
            background: var(--btn-red, #e60000);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 15px;
            width: 100%;
            font-size: 1.1rem;
            transition: transform 0.2s;
        }

        .login-form button:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Ícone de usuário centralizado no topo -->
        <i class="fas fa-user login-icon"></i>
        
        <form class="login-form" id="form-login">
            <input type="email" id="email" placeholder="E-mail" required>
            <input type="password" id="senha" placeholder="Senha" required>
            
            <button type="submit">Entrar</button>
        </form>
    </div>
    <script 
        src="login.js">
    </script>
    <!-- Coloque isto antes do seu script principal (ex: antes do <script src="app.js"></script>) -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</body>
</html>
