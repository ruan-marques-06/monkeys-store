<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Monkeys Store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Adicionando o Toastify para as notificações -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <style>
        /* Estilos do Formulário */
        .maker-container { padding: 40px; display: flex; flex-direction: column; align-items: center; gap: 40px; }
        .maker-form { background: #1a1a1a; border: 1px solid #333; padding: 30px; border-radius: 8px; width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 20px; }
        .maker-form h2 { margin-top: 0; color: #28a745; text-transform: uppercase; font-size: 1.2rem; text-align: center; }
        .maker-form input, .maker-form textarea { padding: 12px; background: #111; border: 1px solid #333; color: white; border-radius: 4px; font-size: 1rem; font-family: inherit; }
        .maker-form button { background: #e60000; color: white; border: none; padding: 15px; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .maker-form button:hover { transform: scale(1.02); background: #cc0000; }
        .btn-cancelar { background: #555 !important; display: none; }

        /* Estilos da Tabela de Estoque */
        .estoque-container { width: 100%; max-width: 1000px; background: #1a1a1a; padding: 20px; border-radius: 8px; border: 1px solid #333; overflow-x: auto; }
        .estoque-container h3 { color: white; margin-top: 0; text-transform: uppercase; }
        table { width: 100%; border-collapse: collapse; text-align: left; color: white; }
        th, td { padding: 15px; border-bottom: 1px solid #333; }
        th { color: #888; font-weight: normal; text-transform: uppercase; font-size: 0.9rem; }
        .img-miniatura { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
        .btn-acao { background: none; border: none; font-size: 1.2rem; cursor: pointer; margin-right: 10px; transition: 0.2s; }
        .btn-editar { color: #ffc107; }
        .btn-deletar { color: #e60000; }
        .btn-acao:hover { transform: scale(1.2); }
    </style>
</head>
<body style="background-color: #000; color: white; margin: 0;">

<header class="header-admin" style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 15px 40px; background-color: #000; border-bottom: 1px solid #222;">
    
    <div style="display: flex; justify-content: flex-start; align-items: center;">
        <img src="img/LogoMonkeysHome - Editado.png" alt="Logo Monkeys Store" style="height: 110px; width: auto; object-fit: contain; border-radius: 8px;">
    </div>

    <div style="text-align: center;">
        <h1 style="margin: 0; font-family: 'Bebas Neue', sans-serif; color: rgb(255, 255, 255); font-size: 28px; letter-spacing: 2px;">
            MONKEYS <span style="color: var(--brand-red, #9b59b6);">MAKER</span>
        </h1>
    </div>
    
    <nav class="nav-admin" style="display: flex; justify-content: flex-end; align-items: center; gap: 30px;">
        <a href="painel.html" style="color: white; text-decoration: none; font-family: sans-serif; font-size: 14px; font-weight: bold; transition: color 0.3s;">
            <i class="fas fa-box" style="margin-right: 5px;"></i> Produtos
        </a>
        <a href="pedidos-admin.html" style="color: #888; text-decoration: none; font-family: sans-serif; font-size: 14px; font-weight: bold; transition: color 0.3s;" onmouseover="this.style.color='white'" onmouseout="this.style.color='#888'">
            <i class="fas fa-shopping-cart" style="margin-right: 5px;"></i> Encomendas
        </a>
        <div style="width: 1px; height: 20px; background-color: #333;"></div>
        <i class="fa fa-sign-out-alt icon" style="cursor: pointer; color: #888; font-size: 18px; transition: color 0.3s;" title="Sair do Painel" onclick="window.location.href='index.html'" onmouseover="this.style.color='var(--brand-red, #ff0000)'" onmouseout="this.style.color='#888'"></i>
    </nav>
</header>

    <main class="maker-container">
        <!-- FORMULÁRIO -->
        <form id="form-maker" class="maker-form">
            <h2 id="titulo-form">Adicionar Novo Produto</h2>
            
            <input type="hidden" id="produtoId">
            
            <input type="text" id="nome" placeholder="Nome da Peça (ex: Camisa Oversized Puma)" required>
            
            <!-- NOVO CAMPO DE CATEGORIA AQUI -->
            <input type="text" id="categoria" placeholder="Categoria (ex: OVERSIZED, BONE, CALCADO)" required>
            
            <textarea id="descricao" placeholder="Descrição e detalhes da peça..." rows="3" required></textarea>
            
            <div style="display: flex; gap: 10px;">
                <input type="number" id="preco" placeholder="Preço (ex: 89.90)" step="0.01" style="flex: 1;" required>
                <input type="number" id="quantidade" placeholder="Qtd. Estoque" style="flex: 1;" required>
            </div>
            
            <input type="file" id="imagemUrl" accept="image/*" required>
            
            <button type="submit" id="btn-salvar">Publicar no Catálogo</button>
            <button type="button" id="btn-cancelar" class="btn-cancelar" onclick="cancelarEdicao()">Cancelar Edição</button>
        </form>

        <!-- TABELA DE LISTAGEM -->
        <div class="estoque-container">
            <h3>Estoque Atual</h3>
            <table>
                <thead>
                    <tr>
                        <th>Imagem</th>
                        <th>Produto</th>
                        <th>Preço</th>
                        <th>Estoque</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-corpo">
                </tbody>
            </table>
        </div>
    </main>

    <!-- Toastify Script -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="maker.js"></script>
</body>
</html>
