<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Monkeys Store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #000;
        }
        .login-card {
            background: var(--bg-card, #111);
            border: 1px solid var(--border-color, #333);
            border-radius: 30px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
        }
        .login-icon {
            font-size: 4rem;
            color: var(--price-green, #00ff00);
            margin-bottom: 20px;
        }
        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .login-form input {
            padding: 15px;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box;
        }
        .login-form input:focus {
            outline: none;
            border-color: var(--price-green, #00ff00);
        }
        .login-form button {
            background: var(--btn-red, #e60000);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 10px;
            font-size: 1.1rem;
        }
        .link-voltar {
            color: #aaa;
            margin-top: 20px;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .link-voltar:hover { color: white; }
    </style>
</head>
<body>

    <div class="login-card">
        <i class="fas fa-user-plus login-icon"></i>
        <h2 style="color: white; margin-top: 0; margin-bottom: 20px;">Criar Conta</h2>
        
        <form class="login-form" id="form-cadastro">
            <!-- Atributos base da classe Usuario -->
            <input type="text" id="nome" placeholder="Nome Completo" required>
            <input type="email" id="email" placeholder="E-mail" required>
            <input type="password" id="senha" placeholder="Crie uma Senha" required>
            
            <!-- Atributos exclusivos da classe Cliente -->
            <input type="text" id="cpf" placeholder="CPF (Somente números)" maxlength="11" required>
            <input type="tel" id="telefone" placeholder="Telefone com DDD" required>
            
            <button type="submit">Cadastrar</button>
        </form>
        
        <a href="login.html" class="link-voltar">Já possui conta? Fazer login</a>
    </div>
    <script src="cadastro.js"></script>
</body>
</html>
